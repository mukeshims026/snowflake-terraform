# ─────────────────────────────────────────────────────────────────────────────
# Snowflake Terraform CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   dev  branch push  → deploys to DEV Snowflake environment
#   main branch push  → deploys to QA  Snowflake environment
# ─────────────────────────────────────────────────────────────────────────────

name: Snowflake Terraform Deploy

on:
  push:
    branches:
      - dev    # ← triggers DEV deployment
      - main   # ← triggers QA deployment
    paths:
      - "**/*.tf"
      - "**/*.tfvars"

  pull_request:
    branches:
      - main   # ← runs plan-only check on PRs targeting main (no apply)
    paths:
      - "**/*.tf"
      - "**/*.tfvars"

env:
  TF_WORKING_DIR: "."
  TF_VERSION: "1.8.5"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Determine which environment to target based on the branch
  # ───────────────────────────────────────────────────────────────────────────
  set-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment from branch
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=qa" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Terraform Plan + Apply
  # ───────────────────────────────────────────────────────────────────────────
  terraform:
    # name: Terraform ${{ toUpper(needs.set-environment.outputs.environment) }}
    name: Terraform ${{ needs.set-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}   # maps to GitHub environment (optional)

    env:
      ENV: ${{ needs.set-environment.outputs.environment }}

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Terraform ────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 3. Set environment-specific secrets as TF_VAR_* variables ─────────
      #       Terraform automatically reads TF_VAR_<name> as variable values.
      - name: Export Snowflake credentials
        run: |
          if [[ "$ENV" == "qa" ]]; then
            echo "TF_VAR_snowflake_account=${{ secrets.SF_ACCOUNT_QA }}"        >> $GITHUB_ENV
            echo "TF_VAR_username=${{ secrets.SF_USER_QA }}"                   >> $GITHUB_ENV
            echo "TF_VAR_password=${{ secrets.SF_PASSWORD_QA }}"               >> $GITHUB_ENV
            echo "TF_VAR_role=${{ secrets.SF_ROLE_QA }}"                       >> $GITHUB_ENV
            echo "TF_VAR_snowflake_region=${{ secrets.SF_REGION_QA }}"          >> $GITHUB_ENV
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_QA }}"        >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}" >> $GITHUB_ENV
            echo "TF_STATE_BUCKET=terraform-state-mukesh"                        >> $GITHUB_ENV
            echo "TF_STATE_KEY=snowflake/terraform.tfstate"                     >> $GITHUB_ENV
            echo "TF_LOCK_TABLE=terraform-state-mukesh"                                     >> $GITHUB_ENV
            echo "TF_REGION=ap-southeast-2"                                          >> $GITHUB_ENV
          else
            echo "TF_VAR_snowflake_account=${{ secrets.SF_ACCOUNT_DEV }}"       >> $GITHUB_ENV
            echo "TF_VAR_username=${{ secrets.SF_USER_DEV }}"                   >> $GITHUB_ENV
            echo "TF_VAR_password=${{ secrets.SF_PASSWORD_DEV }}"               >> $GITHUB_ENV
            echo "TF_VAR_role=${{ secrets.SF_ROLE_DEV }}"                       >> $GITHUB_ENV
            echo "TF_VAR_snowflake_region=${{ secrets.SF_REGION_DEV }}"         >> $GITHUB_ENV
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}"       >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}" >> $GITHUB_ENV
            echo "TF_STATE_BUCKET=tf-state-snowflake-dev"                       >> $GITHUB_ENV
            echo "TF_STATE_KEY=snowflake/terraform.tfstate"                     >> $GITHUB_ENV
            echo "TF_LOCK_TABLE=tf-lock-dev"                                    >> $GITHUB_ENV
            echo "TF_REGION=us-east-1"                                          >> $GITHUB_ENV
          fi

      # ── 4. Terraform Init (with environment-specific S3 backend) ──────────
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # ── 5. Terraform Validate ─────────────────────────────────────────────
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ── 6. Terraform Plan ─────────────────────────────────────────────────
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="envs/${{ env.ENV }}.tfvars" \
            -out=tfplan \
            -input=false

      # ── 7. Terraform Apply (only on push, not on pull_request) ────────────
      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

      # ── 8. Upload plan artifact for review ────────────────────────────────
      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5